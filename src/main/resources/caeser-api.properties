# Basis-URL des Caeser-Backends (Cloudflare Worker).
# Nach dem Deploy die echte Worker-URL eintragen, z. B. https://caeser-backend.<dein-konto>.workers.dev
# Erlaubt: https://...  sowie für "wrangler dev" http://127.0.0.1:<port> bzw. http://localhost:<port>
# Überschreibbar beim Start mit -Dcaeser.api.url=...
# Solange hier der Platzhalter steht, gilt das Backend als "nicht eingerichtet" (keine Netzwerkaufrufe).
baseUrl=https://caeser-backend.caeser-backend.workers.dev
