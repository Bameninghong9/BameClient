plugins {
	id 'fabric-loom' version '1.18-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

task printMethods { doLast { def clazz = Class.forName('net.minecraft.client.render.RenderLayer', false, project.configurations.compileClasspath.classLoader); clazz.getMethods().each { println it.name } } }

task printVCMethods { doLast { def clazz = Class.forName('net.minecraft.client.render.VertexConsumer', false, project.configurations.compileClasspath.classLoader); clazz.getMethods().each { println it.name } } }

// Standalone planner checks do not require a Minecraft client or JUnit.
sourceSets {
    plannerTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('plannerTest', JavaExec) {
    dependsOn plannerTestClasses
    classpath = sourceSets.plannerTest.runtimeClasspath
    mainClass = 'com.bame.client.module.LayerMiningPlannerTest'
}
tasks.named('check') { dependsOn 'plannerTest' }
