plugins {
	id 'fabric-loom' version '1.17.21'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

task printMethods { doLast { def clazz = Class.forName('net.minecraft.client.render.RenderLayer', false, project.configurations.compileClasspath.classLoader); clazz.getMethods().each { println it.name } } }

task decompileFeatures {
    doLast {
        def cp = sourceSets.main.compileClasspath.asPath
        def pb = new ProcessBuilder("javap", "-c", "-cp", cp, "net.minecraft.client.render.entity.feature.Deadmau5FeatureRenderer")
        def proc = pb.start()
        println proc.inputStream.text
    }
}


// Standalone planner checks do not require a Minecraft client or JUnit.
sourceSets {
    plannerTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('plannerTest', JavaExec) {
    dependsOn plannerTestClasses
    classpath = sourceSets.plannerTest.runtimeClasspath
    mainClass = 'com.bame.client.module.LayerMiningPlannerTest'
}
tasks.register('testCosmeticModels', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bame.client.cosmetics.BedrockCosmeticModelTest'
}
tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
    filter {
        setFailOnNoMatchingTests(false)
    }
}
tasks.named('check') { dependsOn 'plannerTest' }
